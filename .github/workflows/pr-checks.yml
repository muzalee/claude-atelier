name: pr-checks

on:
  # pull_request_target so bot-authored PRs (release-please) also trigger checks.
  # GITHUB_TOKEN doesn't recurse via `pull_request`, but `pull_request_target`
  # runs in the base branch's context and fires for bot events too.
  # Safe here: both jobs read metadata only (PR title, git log) — no PR code
  # is checked out or executed. Do NOT add code-running steps to this workflow
  # without switching back to `pull_request` (or explicitly pinning to the base
  # SHA), or a fork PR could exfiltrate secrets.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            test
            build
            ci
            revert
          scopes: |
            atelier
            atelier-typescript
            marketplace
            ci
            docs
            release
            main
          requireScope: false
          subjectPattern: ^[A-Za-z].+$
          subjectPatternError: |
            The PR title subject must start with a letter.
            Example: `feat(atelier): make /build autonomous`

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request_target defaults to base ref; explicitly check out the
          # PR's head so commitlint sees the PR commits, not just main's.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
