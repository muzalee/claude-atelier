name: release

# Requires repo setting: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests" must be checked.
# Without it, release-please fails with: "GitHub Actions is not permitted to
# create or approve pull requests." (This is a repo-level toggle, not a
# workflow-level one, so it can't be set from this file.)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
