name: release

# Uses a fine-grained PAT (RELEASE_PLEASE_TOKEN) instead of GITHUB_TOKEN so
# that pr-checks fires on the release PRs release-please opens. GitHub's
# security model does not trigger further workflows for PRs opened by
# GITHUB_TOKEN — without the PAT, release PRs sit with "no checks reported"
# and can only be merged via admin bypass.
#
# Required PAT permissions on this repo: Contents: read/write,
# Pull requests: read/write, Issues: read/write (for auto-close on release).
# Store as repository secret RELEASE_PLEASE_TOKEN.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
